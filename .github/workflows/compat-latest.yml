name: compat-latest

# Live upstream compatibility: latest harness versions against current pins.
# Reports drift only — NEVER gates (continue-on-error throughout).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install latest harness CLIs
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
          curl -fsSL https://opencode.ai/install | bash
          claude --version; codex --version; opencode --version || true
      - name: Bootstrap schema validator
        continue-on-error: true
        run: tests/e2e/run.sh --bootstrap
      - name: Conformance against latest (advisory, reports drift only)
        continue-on-error: true
        run: tests/e2e/run.sh --suite conformance --advisory || true
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-latest-results
          path: tests/e2e/results/
